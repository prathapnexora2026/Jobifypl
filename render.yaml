# Render deployment config for JobifyPL.
services:
  - type: web
    name: jobifypl
    runtime: python
    plan: starter          # paid plan; use "free" to test
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_DEV_MODE
        value: "true"       # switch to false + add Twilio keys for real SMS
      - key: DATABASE_URL
        sync: false         # set to your Render Postgres URL
