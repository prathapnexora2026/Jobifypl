# Render Blueprint for JobifyPL.
# Creates: 1 web service + 1 Postgres database + 1 persistent disk (for uploads).
#
# After Render imports this, set the "sync: false" secrets (PayU keys, Twilio,
# admin phone) in the dashboard — they are NEVER stored in git.
services:
  - type: web
    name: jobifypl
    runtime: python
    plan: starter                 # $7/mo; bump to standard later if traffic grows
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    # Persistent disk — uploaded photos, CVs and the APK live here and SURVIVE
    # every deploy / GitHub push. Mounted at /data; DATA_DIR points the app to it.
    disk:
      name: jobify-data
      mountPath: /data
      sizeGB: 5

    envVars:
      # --- Database: auto-filled from the Postgres service below ---
      - key: DATABASE_URL
        fromDatabase:
          name: jobifypl-db
          property: connectionString

      # --- Storage: use the mounted disk ---
      - key: DATA_DIR
        value: /data

      # --- Public URL (PayU redirect/notify + APK point here) ---
      - key: BASE_URL
        value: https://jobifypl.pl

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true       # Render generates a strong random secret
      - key: JWT_EXPIRE_MINUTES
        value: "43200"

      # --- SMS (Infobip = real, global). Set SMS_DEV_MODE=false in the dashboard
      #     and fill the Infobip secrets to send real OTP worldwide. ---
      - key: SMS_DEV_MODE
        value: "true"             # flip to "false" in dashboard to go live
      - key: SMS_PROVIDER
        value: "infobip"
      - key: INFOBIP_BASE_URL
        sync: false               # e.g. 1eyqrk.api.infobip.com
      - key: INFOBIP_API_KEY
        sync: false               # secret — set only in the dashboard
      - key: INFOBIP_SENDER
        value: "JobifyPL"
      # Twilio kept as optional fallback (unused unless SMS_PROVIDER=twilio)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      # --- OTP ---
      - key: OTP_EXPIRE_MINUTES
        value: "10"
      - key: OTP_LENGTH
        value: "6"

      # --- Admin ---
      - key: ADMIN_PHONES
        sync: false               # set your admin number in the dashboard
      - key: DEV_ROLE_OVERRIDE
        value: "false"            # production: each role uses its own number

      # --- PayU (Poland) LIVE keys — set ALL of these in the dashboard, never git ---
      - key: PAYU_ENABLED
        value: "true"
      - key: PAYU_BASE
        value: https://secure.payu.com
      - key: PAYU_POS_ID
        sync: false
      - key: PAYU_MD5_KEY
        sync: false
      - key: PAYU_CLIENT_ID
        sync: false
      - key: PAYU_CLIENT_SECRET
        sync: false
      # Email for Contact-Us notifications (set these in the dashboard to enable)
      - key: SMTP_HOST
        sync: false               # e.g. smtp.hostinger.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false               # e.g. jobifyplsupport@jobifypl.pl
      - key: SMTP_PASS
        sync: false               # mailbox password / app password
      - key: SMTP_FROM
        sync: false               # optional; defaults to SMTP_USER
      - key: CONTACT_EMAIL_TO
        value: "jobifyplsupport@jobifypl.pl"

databases:
  - name: jobifypl-db
    plan: basic-1gb               # Postgres; pick a bigger tier in the dashboard if you want 5GB
    databaseName: jobifypl
    user: jobifypl
